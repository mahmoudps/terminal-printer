appId: io.github.mahmoudps.terminalprinter
productName: Terminal Printer
copyright: Copyright © 2026 mahmoudps

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

# SumatraPDF (shipped inside pdf-to-printer, Windows-only) must be a real file
# on disk, so it can't live inside the asar archive.
asar: true
asarUnpack:
  - "**/node_modules/pdf-to-printer/**"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false # per-user install — no admin rights required
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.utilities
  icon: build/icon.png # electron-builder generates the .icns from this

dmg:
  title: Terminal Printer

linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: mahmoudps <m@atyaf.co>
  icon: build/icon.png

# Releases are published to GitHub by the CI workflow.
publish:
  provider: github
  owner: mahmoudps
  repo: terminal-printer
